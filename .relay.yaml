git:
  notifyMode: next
  origins:
    - name: iad1
      kind: relay
      host: iad1.relaygateway.net
      fetch: true
      notify: true
    - name: sjc1
      kind: relay
      host: sjc1.relaygateway.net
      notify: true
    - name: hkg1
      kind: relay
      host: hkg1.relaygateway.net
      notify: true
  branchRules:
    branches:
      - name: "*"
        rule:
          requireSigned: true
          allowUnsigned: false
          allowedKeys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILanag4UriR/4IatVhRxv59gG6/5xEt6ccg/jzINE3R9 relay-catalog-signing"
          adminKeys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILanag4UriR/4IatVhRxv59gG6/5xEt6ccg/jzINE3R9 relay-catalog-signing"
      - name: develop
        rule:
          allowUnsigned: true
          requireSigned: false
